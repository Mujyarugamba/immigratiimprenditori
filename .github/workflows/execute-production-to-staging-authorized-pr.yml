name: Authorized Production to staging restore visible

on:
  pull_request:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - .github/workflows/execute-production-to-staging-authorized-pr.yml

permissions:
  contents: read

concurrency:
  group: authorized-production-to-staging-restore
  cancel-in-progress: false

jobs:
  restore:
    if: github.head_ref == 'ops/production-restore-drill-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      EXPECTED_PROD_REF: hvfvfatlaspcpszgizhg
    steps:
      - name: Check out operational branch
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate identities backup sentinel and compatibility read-only
        id: counts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_DB_URL"
          test -n "$STAGING_DB_URL"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          prod=urlsplit(os.environ['PROD_DB_URL'])
          stage=urlsplit(os.environ['STAGING_DB_URL'])
          pu=unquote(prod.username or '')
          su=unquote(stage.username or '')
          if pu != 'postgres.' + os.environ['EXPECTED_PROD_REF']:
              raise SystemExit('RESTORE_IDENTITY = FAIL production')
          if not su.startswith('postgres.') or su == pu:
              raise SystemExit('RESTORE_IDENTITY = FAIL staging')
          for label,u in [('production',prod),('staging',stage)]:
              if not (u.hostname or '').endswith('.pooler.supabase.com') or u.port != 5432:
                  raise SystemExit(f'RESTORE_IDENTITY = FAIL {label} session pooler')
          print('RESTORE_CONNECTION_IDENTITIES = PASS')
          PY
          qp() { psql "$PROD_DB_URL" -Atqc "$1"; }
          qs() { psql "$STAGING_DB_URL" -Atqc "$1"; }

          [[ "$(qs 'select count(*) from public.contents;')" == "18" ]]
          [[ "$(qs 'select count(*) from public.observatory_indicators;')" == "1" ]]
          [[ "$(qs 'select count(*) from public.accounts;')" == "0" ]]
          [[ "$(qs 'select count(*) from public.profiles;')" == "0" ]]
          [[ "$(qs 'select count(*) from auth.users;')" == "0" ]]
          [[ "$(qs 'select count(*) from auth.identities;')" == "0" ]]
          [[ "$(qs 'select count(*) from auth.sessions;')" == "0" ]]
          [[ "$(qs 'select count(*) from auth.refresh_tokens;')" == "0" ]]
          [[ "$(qs 'select count(*) from auth.mfa_factors;')" == "0" ]]
          [[ "$(qs "select count(*) from pg_extension e join pg_namespace n on n.oid=e.extnamespace where n.nspname='public' and e.extname <> 'plpgsql';")" == "0" ]]
          echo "STAGING_BACKED_UP_SENTINEL = PASS"

          prod_users_sig="$(qp "select md5(coalesce(string_agg(column_name||':'||udt_name||':'||is_nullable,',' order by ordinal_position),'')) from information_schema.columns where table_schema='auth' and table_name='users';")"
          stage_users_sig="$(qs "select md5(coalesce(string_agg(column_name||':'||udt_name||':'||is_nullable,',' order by ordinal_position),'')) from information_schema.columns where table_schema='auth' and table_name='users';")"
          prod_id_sig="$(qp "select md5(coalesce(string_agg(column_name||':'||udt_name||':'||is_nullable,',' order by ordinal_position),'')) from information_schema.columns where table_schema='auth' and table_name='identities';")"
          stage_id_sig="$(qs "select md5(coalesce(string_agg(column_name||':'||udt_name||':'||is_nullable,',' order by ordinal_position),'')) from information_schema.columns where table_schema='auth' and table_name='identities';")"
          [[ "$prod_users_sig" == "$stage_users_sig" ]]
          [[ "$prod_id_sig" == "$stage_id_sig" ]]
          echo "AUTH_SCHEMA_COMPATIBILITY = PASS"

          languages="$(qp 'select count(*) from public.languages;')"
          contents="$(qp 'select count(*) from public.contents;')"
          indicators="$(qp 'select count(*) from public.observatory_indicators;')"
          accounts="$(qp 'select count(*) from public.accounts;')"
          profiles="$(qp 'select count(*) from public.profiles;')"
          auth_users="$(qp 'select count(*) from auth.users;')"
          auth_identities="$(qp 'select count(*) from auth.identities;')"
          migration_count="$(qp 'select count(*) from supabase_migrations.schema_migrations;')"
          migration_max="$(qp "select coalesce(max(version::text),'0') from supabase_migrations.schema_migrations;")"
          [[ "$(qp "select count(*) from public.accounts a left join auth.users u on u.id=a.auth_user_id where a.auth_user_id is not null and u.id is null;")" == "0" ]]
          [[ "$(qp "select count(*) from public.profiles p left join auth.users u on u.id=p.id where u.id is null;")" == "0" ]]
          for v in "$languages" "$contents" "$indicators" "$accounts" "$profiles" "$auth_users" "$auth_identities" "$migration_count" "$migration_max"; do [[ "$v" =~ ^[0-9]+$ ]]; done
          {
            echo "languages=$languages"
            echo "contents=$contents"
            echo "indicators=$indicators"
            echo "accounts=$accounts"
            echo "profiles=$profiles"
            echo "auth_users=$auth_users"
            echo "auth_identities=$auth_identities"
            echo "migration_count=$migration_count"
            echo "migration_max=$migration_max"
          } >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_READ_ONLY_PREFLIGHT = PASS"

      - name: Build fresh production restore set read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-set
          supabase db dump --db-url "$PROD_DB_URL" -f restore-set/roles.sql --role-only
          supabase db dump --db-url "$PROD_DB_URL" -f restore-set/schema.sql
          supabase db dump --db-url "$PROD_DB_URL" -f restore-set/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          supabase db dump --db-url "$PROD_DB_URL" -f restore-set/history_schema.sql --schema supabase_migrations
          supabase db dump --db-url "$PROD_DB_URL" -f restore-set/history_data.sql --use-copy --data-only --schema supabase_migrations
          docker run --rm \
            -e DB_URL="$PROD_DB_URL" \
            -v "$PWD/restore-set:/out" \
            postgres:17-alpine \
            sh -lc 'pg_dump "$DB_URL" --data-only --no-owner --no-privileges --use-copy --table=auth.users --table=auth.identities --file=/out/auth_data.sql'
          for f in roles.sql schema.sql data.sql history_schema.sql history_data.sql auth_data.sql; do test -s "restore-set/$f"; done
          grep -Eq 'CREATE TABLE .*contents' restore-set/schema.sql
          grep -Eq 'COPY .*languages' restore-set/data.sql
          grep -Eq 'COPY auth\.users|COPY "auth"\."users"' restore-set/auth_data.sql
          echo "PRODUCTION_RESTORE_SET = PASS"

      - name: Normalize managed role statements
        shell: bash
        run: |
          set -euo pipefail
          python3 - restore-set/roles.sql <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          parts=re.split(r'(?<=;)',text); kept=[]
          patterns=[
            re.compile(r'(?is)^\s*ALTER\s+ROLE\b.*\blog_min_messages\b'),
            re.compile(r'(?is)^\s*GRANT\s+SET\s+ON\s+PARAMETER\s+"?log_min_messages"?\s+TO\b'),
            re.compile(r'(?is)^\s*GRANT\s+"?postgres"?\s+TO\s+"?cli_login_postgres"?\b')]
          for part in parts:
              s=part.strip()
              if s and any(x.match(s) for x in patterns): continue
              kept.append(part)
          filtered=''.join(kept)
          if re.search(r'(?i)\blog_min_messages\b',filtered): raise SystemExit('unrecognized log_min_messages statement')
          p.write_text(filtered,encoding='utf-8')
          print('RESTORE_ROLE_NORMALIZATION = PASS')
          PY

      - name: Build atomic restore transaction
        shell: bash
        env:
          PROD_LANGUAGES: ${{ steps.counts.outputs.languages }}
          PROD_CONTENTS: ${{ steps.counts.outputs.contents }}
          PROD_INDICATORS: ${{ steps.counts.outputs.indicators }}
          PROD_ACCOUNTS: ${{ steps.counts.outputs.accounts }}
          PROD_PROFILES: ${{ steps.counts.outputs.profiles }}
          PROD_AUTH_USERS: ${{ steps.counts.outputs.auth_users }}
          PROD_AUTH_IDENTITIES: ${{ steps.counts.outputs.auth_identities }}
          PROD_MIGRATION_COUNT: ${{ steps.counts.outputs.migration_count }}
          PROD_MIGRATION_MAX: ${{ steps.counts.outputs.migration_max }}
        run: |
          set -euo pipefail
          cat > restore-set/pre.sql <<'SQL'
          DO $guard$
          BEGIN
            IF (SELECT count(*) FROM public.contents) <> 18 THEN RAISE EXCEPTION 'STAGING_CHANGED contents'; END IF;
            IF (SELECT count(*) FROM public.observatory_indicators) <> 1 THEN RAISE EXCEPTION 'STAGING_CHANGED indicators'; END IF;
            IF (SELECT count(*) FROM auth.users) <> 0 OR (SELECT count(*) FROM auth.identities) <> 0 THEN RAISE EXCEPTION 'STAGING_CHANGED auth'; END IF;
          END;
          $guard$;
          DROP SCHEMA public CASCADE;
          CREATE SCHEMA public AUTHORIZATION postgres;
          DROP SCHEMA IF EXISTS supabase_migrations CASCADE;
          SQL
          cat > restore-set/post.sql <<SQL
          SET session_replication_role = origin;
          DO \$hook\$
          BEGIN
            IF to_regclass('auth.users') IS NULL THEN RAISE EXCEPTION 'AUTH_USERS_MISSING'; END IF;
            IF to_regprocedure('public.handle_new_user()') IS NULL THEN RAISE EXCEPTION 'HANDLE_NEW_USER_MISSING'; END IF;
          END;
          \$hook\$;
          DROP TRIGGER IF EXISTS on_auth_user_created ON auth.users;
          CREATE TRIGGER on_auth_user_created AFTER INSERT ON auth.users FOR EACH ROW EXECUTE FUNCTION public.handle_new_user();
          DO \$verify\$
          DECLARE rls_count integer; hook_count integer; account_orphans integer; profile_orphans integer;
          BEGIN
            IF (SELECT count(*) FROM public.languages) <> $PROD_LANGUAGES THEN RAISE EXCEPTION 'COUNT languages'; END IF;
            IF (SELECT count(*) FROM public.contents) <> $PROD_CONTENTS THEN RAISE EXCEPTION 'COUNT contents'; END IF;
            IF (SELECT count(*) FROM public.observatory_indicators) <> $PROD_INDICATORS THEN RAISE EXCEPTION 'COUNT indicators'; END IF;
            IF (SELECT count(*) FROM public.accounts) <> $PROD_ACCOUNTS THEN RAISE EXCEPTION 'COUNT accounts'; END IF;
            IF (SELECT count(*) FROM public.profiles) <> $PROD_PROFILES THEN RAISE EXCEPTION 'COUNT profiles'; END IF;
            IF (SELECT count(*) FROM auth.users) <> $PROD_AUTH_USERS THEN RAISE EXCEPTION 'COUNT auth_users'; END IF;
            IF (SELECT count(*) FROM auth.identities) <> $PROD_AUTH_IDENTITIES THEN RAISE EXCEPTION 'COUNT auth_identities'; END IF;
            IF (SELECT count(*) FROM supabase_migrations.schema_migrations) <> $PROD_MIGRATION_COUNT THEN RAISE EXCEPTION 'COUNT migration'; END IF;
            IF (SELECT coalesce(max(version::text),'0') FROM supabase_migrations.schema_migrations) <> '$PROD_MIGRATION_MAX' THEN RAISE EXCEPTION 'MAX migration'; END IF;
            SELECT count(*) INTO rls_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('accounts','account_role_assignments','editorial_inbox_items','editorial_submissions') AND c.relrowsecurity;
            IF rls_count <> 4 THEN RAISE EXCEPTION 'RLS expected 4 found %',rls_count; END IF;
            SELECT count(*) INTO hook_count FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace JOIN pg_proc p ON p.oid=t.tgfoid JOIN pg_namespace pn ON pn.oid=p.pronamespace WHERE NOT t.tgisinternal AND n.nspname='auth' AND c.relname='users' AND t.tgname='on_auth_user_created' AND pn.nspname='public' AND p.proname='handle_new_user';
            IF hook_count <> 1 THEN RAISE EXCEPTION 'AUTH_HOOK expected 1 found %',hook_count; END IF;
            SELECT count(*) INTO account_orphans FROM public.accounts a LEFT JOIN auth.users u ON u.id=a.auth_user_id WHERE a.auth_user_id IS NOT NULL AND u.id IS NULL;
            SELECT count(*) INTO profile_orphans FROM public.profiles p LEFT JOIN auth.users u ON u.id=p.id WHERE u.id IS NULL;
            IF account_orphans <> 0 OR profile_orphans <> 0 THEN RAISE EXCEPTION 'AUTH_ORPHANS accounts %, profiles %',account_orphans,profile_orphans; END IF;
          END;
          \$verify\$;
          SQL
          echo "ATOMIC_RESTORE_TRANSACTION_BUILT = PASS"

      - name: Execute explicitly authorized staging overwrite
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_DB_URL" \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file restore-set/pre.sql \
            --file restore-set/roles.sql \
            --file restore-set/schema.sql \
            --command 'SET session_replication_role = replica' \
            --file restore-set/auth_data.sql \
            --file restore-set/data.sql \
            --file restore-set/history_schema.sql \
            --file restore-set/history_data.sql \
            --file restore-set/post.sql
          echo "PRODUCTION_TO_STAGING_ATOMIC_RESTORE = PASS"

      - name: External postflight after commit
        shell: bash
        env:
          PROD_CONTENTS: ${{ steps.counts.outputs.contents }}
          PROD_ACCOUNTS: ${{ steps.counts.outputs.accounts }}
          PROD_AUTH_USERS: ${{ steps.counts.outputs.auth_users }}
          PROD_AUTH_IDENTITIES: ${{ steps.counts.outputs.auth_identities }}
          PROD_MIGRATION_MAX: ${{ steps.counts.outputs.migration_max }}
        run: |
          set -euo pipefail
          q() { psql "$STAGING_DB_URL" -Atqc "$1"; }
          [[ "$(q 'select count(*) from public.contents;')" == "$PROD_CONTENTS" ]]
          [[ "$(q 'select count(*) from public.accounts;')" == "$PROD_ACCOUNTS" ]]
          [[ "$(q 'select count(*) from auth.users;')" == "$PROD_AUTH_USERS" ]]
          [[ "$(q 'select count(*) from auth.identities;')" == "$PROD_AUTH_IDENTITIES" ]]
          [[ "$(q "select coalesce(max(version::text),'0') from supabase_migrations.schema_migrations;")" == "$PROD_MIGRATION_MAX" ]]
          [[ "$(q "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('accounts','account_role_assignments','editorial_inbox_items','editorial_submissions') and c.relrowsecurity;")" == "4" ]]
          echo "PRODUCTION_TO_STAGING_EXTERNAL_POSTFLIGHT = PASS"

      - name: Remove plaintext restore material
        if: always()
        shell: bash
        run: rm -rf restore-set
