name: Authorized Production migrations phase 2

on:
  pull_request:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - .github/workflows/authorized-production-migrations-phase2.yml

permissions:
  contents: read

jobs:
  apply-production-migrations-20-24:
    if: github.head_ref == 'ops/production-restore-drill-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      EXPECTED_PROD_REF: hvfvfatlaspcpszgizhg
      CANDIDATE_SHA: 4189cf2c8b10b1ee3c2b6af31287c22c41784663
    steps:
      - name: Check out pinned release candidate
        uses: actions/checkout@v4
        with:
          ref: 4189cf2c8b10b1ee3c2b6af31287c22c41784663
          fetch-depth: 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Production phase-2 preflight with verified admin MFA
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_DB_URL"
          test -n "$BACKUP_PASSPHRASE"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          u = urlsplit(os.environ['PROD_DB_URL'])
          username = unquote(u.username or '')
          if username != 'postgres.' + os.environ['EXPECTED_PROD_REF']:
              raise SystemExit('PRODUCTION_IDENTITY = FAIL')
          if not (u.hostname or '').endswith('.pooler.supabase.com') or u.port != 5432:
              raise SystemExit('PRODUCTION_SESSION_POOLER = FAIL')
          print('PRODUCTION_IDENTITY = PASS')
          print('PRODUCTION_SESSION_POOLER = PASS')
          PY
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations;")" == "228" ]]
          [[ "$(psql "$PROD_DB_URL" -Atqc "select max(version::text) from supabase_migrations.schema_migrations;")" == "20260822190000" ]]
          admins="$(psql "$PROD_DB_URL" -Atqc "select count(*) from public.account_role_assignments r join public.accounts a on a.id=r.account_id where r.role_code='amministratore_applicativo' and r.assignment_status='active' and a.account_status='active';")"
          verified_admin_factors="$(psql "$PROD_DB_URL" -Atqc "select count(*) from auth.mfa_factors f join public.accounts a on a.auth_user_id=f.user_id join public.account_role_assignments r on r.account_id=a.id where f.status::text='verified' and r.role_code='amministratore_applicativo' and r.assignment_status='active' and a.account_status='active';")"
          [[ "$admins" -ge 2 ]]
          [[ "$verified_admin_factors" -ge 1 ]]
          echo "PRODUCTION_ACTIVE_APP_ADMINS=$admins"
          echo "PRODUCTION_VERIFIED_ADMIN_MFA_FACTORS=$verified_admin_factors"
          echo "PRODUCTION_PHASE2_PREFLIGHT = PASS"

      - name: Create fresh encrypted Production backup at phase-2 hold point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-phase2
          supabase db dump --db-url "$PROD_DB_URL" -f backup-phase2/roles.sql --role-only
          supabase db dump --db-url "$PROD_DB_URL" -f backup-phase2/schema.sql
          supabase db dump --db-url "$PROD_DB_URL" -f backup-phase2/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          for f in backup-phase2/roles.sql backup-phase2/schema.sql backup-phase2/data.sql; do test -s "$f"; done
          python3 - backup-phase2/roles.sql <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          parts = re.split(r'(?<=;)', text)
          kept = []
          alter_role = re.compile(r'(?is)^\s*ALTER\s+ROLE\b.*\blog_min_messages\b')
          grant_parameter = re.compile(r'(?is)^\s*GRANT\s+SET\s+ON\s+PARAMETER\s+"?log_min_messages"?\s+TO\b')
          for part in parts:
              statement = part.strip()
              if statement and (alter_role.match(statement) or grant_parameter.match(statement)):
                  continue
              kept.append(part)
          filtered = ''.join(kept)
          if re.search(r'(?i)\blog_min_messages\b', filtered):
              raise SystemExit('unrecognized log_min_messages statement survived normalization')
          path.write_text(filtered, encoding='utf-8')
          PY
          tar -C backup-phase2 -cf backup-phase2/production-phase2-hold.tar roles.sql schema.sql data.sql
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:BACKUP_PASSPHRASE \
            -in backup-phase2/production-phase2-hold.tar \
            -out backup-phase2/production-phase2-hold.tar.enc
          sha256sum backup-phase2/production-phase2-hold.tar.enc > backup-phase2/production-phase2-hold.tar.enc.sha256
          rm -f backup-phase2/roles.sql backup-phase2/schema.sql backup-phase2/data.sql backup-phase2/production-phase2-hold.tar
          echo "PRODUCTION_PHASE2_BACKUP = PASS"

      - name: Upload encrypted phase-2 hold-point backup
        uses: actions/upload-artifact@v4
        with:
          name: production-phase2-hold-backup-${{ github.run_id }}
          path: |
            backup-phase2/production-phase2-hold.tar.enc
            backup-phase2/production-phase2-hold.tar.enc.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Apply candidate migrations 20 through 24 exactly and in order
        shell: bash
        run: |
          set -euo pipefail
          files=(
            20260822210500_go_live_audit_analytics.sql
            20260822211500_fix_public_rls_mfa_compatibility.sql
            20260822212000_backfill_futurae_route_evidence.sql
            20260822213000_hybrid_editorial_review_governance.sql
            20260822213100_fix_hybrid_null_category_classifier.sql
          )
          expected_prev="20260822190000"
          expected_count=228
          apply_one() {
            local file="$1"
            local version="${file%%_*}"
            local name="${file#${version}_}"
            name="${name%.sql}"
            local current_max current_count tmp dry
            test -s "supabase/migrations/$file"
            current_max="$(psql "$PROD_DB_URL" -Atqc "select max(version::text) from supabase_migrations.schema_migrations;")"
            current_count="$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations;")"
            [[ "$current_max" == "$expected_prev" ]]
            [[ "$current_count" == "$expected_count" ]]
            [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations where version='$version';")" == "0" ]]
            tmp="$(mktemp -d)"
            mkdir -p "$tmp/supabase/migrations"
            printf 'project_id = "production-release"\n' > "$tmp/supabase/config.toml"
            while IFS= read -r remote_version; do
              test -n "$remote_version"
              : > "$tmp/supabase/migrations/${remote_version}_remote.sql"
            done < <(psql "$PROD_DB_URL" -Atqc "select version from supabase_migrations.schema_migrations order by version;")
            cp "supabase/migrations/$file" "$tmp/supabase/migrations/$file"
            echo "===== DRY RUN $file ====="
            set +e
            dry="$(cd "$tmp" && supabase db push --db-url "$PROD_DB_URL" --include-all --dry-run 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$dry"
            [[ $rc -eq 0 ]]
            grep -q "$version" <<< "$dry"
            echo "===== APPLY $file ====="
            (cd "$tmp" && supabase db push --db-url "$PROD_DB_URL" --include-all)
            expected_count=$((expected_count + 1))
            [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations;")" == "$expected_count" ]]
            [[ "$(psql "$PROD_DB_URL" -Atqc "select max(version::text) from supabase_migrations.schema_migrations;")" == "$version" ]]
            [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations where version='$version' and name='$name';")" == "1" ]]
            rm -rf "$tmp"
            expected_prev="$version"
            echo "MIGRATION_${version} = PASS"
          }
          for file in "${files[@]}"; do
            apply_one "$file"
            case "$file" in
              20260822210500_go_live_audit_analytics.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('editorial_content_activity','site_analytics_daily');")" == "2" ]]
                echo "CHECKPOINT_GO_LIVE_AUDIT_ANALYTICS_20 = PASS"
                ;;
              20260822211500_fix_public_rls_mfa_compatibility.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select has_function_privilege('anon','public.access_is_editor()','EXECUTE')::int;")" == "0" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select has_function_privilege('anon','public.access_is_application_admin()','EXECUTE')::int;")" == "0" ]]
                echo "CHECKPOINT_PUBLIC_RLS_MFA_21 = PASS"
                ;;
              20260822212000_backfill_futurae_route_evidence.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from public.observatory_statistical_sources where external_identifier='mlps:futurae:imprenditoria-straniera:2025h1';")" == "1" ]]
                echo "CHECKPOINT_FUTURAE_22 = PASS"
                ;;
              20260822213000_hybrid_editorial_review_governance.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select relrowsecurity::int from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='editorial_secondary_reviews';")" == "1" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='public' and c.relname='contents' and t.tgname='contents_hybrid_secondary_review_gate';")" == "1" ]]
                echo "CHECKPOINT_HYBRID_REVIEW_23 = PASS"
                ;;
              20260822213100_fix_hybrid_null_category_classifier.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select position('coalesce(p_content.primary_category_code' in pg_get_functiondef('public.content_requires_secondary_review(public.contents)'::regprocedure)) > 0;")" == "t" ]]
                echo "CHECKPOINT_HYBRID_NULL_FIX_24 = PASS"
                ;;
            esac
          done
          [[ "$expected_count" == "233" ]]
          [[ "$expected_prev" == "20260822213100" ]]
          echo "PRODUCTION_MIGRATIONS_20_24 = PASS"

      - name: Production phase-2 postflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations;")" == "233" ]]
          [[ "$(psql "$PROD_DB_URL" -Atqc "select max(version::text) from supabase_migrations.schema_migrations;")" == "20260822213100" ]]
          verified_admin_factors="$(psql "$PROD_DB_URL" -Atqc "select count(*) from auth.mfa_factors f join public.accounts a on a.auth_user_id=f.user_id join public.account_role_assignments r on r.account_id=a.id where f.status::text='verified' and r.role_code='amministratore_applicativo' and r.assignment_status='active' and a.account_status='active';")"
          [[ "$verified_admin_factors" -ge 1 ]]
          echo "PRODUCTION_VERIFIED_ADMIN_MFA_FACTORS=$verified_admin_factors"
          echo "PRODUCTION_PHASE2_POSTFLIGHT = PASS"
