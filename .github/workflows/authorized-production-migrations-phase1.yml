name: Authorized Production migrations phase 1

on:
  pull_request:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - .github/workflows/authorized-production-migrations-phase1.yml

permissions:
  contents: read

jobs:
  apply-production-migrations-1-19:
    if: github.head_ref == 'ops/production-restore-drill-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      EXPECTED_PROD_REF: hvfvfatlaspcpszgizhg
      CANDIDATE_SHA: 4189cf2c8b10b1ee3c2b6af31287c22c41784663
      BACKUP_RUN_ID: '32699401840'
    steps:
      - name: Check out pinned release candidate
        uses: actions/checkout@v4
        with:
          ref: 4189cf2c8b10b1ee3c2b6af31287c22c41784663
          fetch-depth: 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Production identity and release hold-point preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_DB_URL"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          u = urlsplit(os.environ['PROD_DB_URL'])
          username = unquote(u.username or '')
          if username != 'postgres.' + os.environ['EXPECTED_PROD_REF']:
              raise SystemExit('PRODUCTION_IDENTITY = FAIL')
          if not (u.hostname or '').endswith('.pooler.supabase.com') or u.port != 5432:
              raise SystemExit('PRODUCTION_SESSION_POOLER = FAIL')
          print('PRODUCTION_IDENTITY = PASS')
          print('PRODUCTION_SESSION_POOLER = PASS')
          PY
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations;")" == "209" ]]
          [[ "$(psql "$PROD_DB_URL" -Atqc "select max(version::text) from supabase_migrations.schema_migrations;")" == "20260820160000" ]]
          [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from auth.mfa_factors;")" == "0" ]]
          echo "PINNED_CANDIDATE = $CANDIDATE_SHA"
          echo "FRESH_BACKUP_RUN = $BACKUP_RUN_ID"
          echo "PRODUCTION_PHASE1_PREFLIGHT = PASS"

      - name: Apply candidate migrations 1 through 19 exactly and in order
        shell: bash
        run: |
          set -euo pipefail

          files=(
            20260820173000_harden_editorial_public_submission.sql
            20260821235000_prioritize_platform_languages.sql
            20260822120000_prepare_content_translation_groups.sql
            20260822130000_seed_atlas_italian_territories.sql
            20260822131000_seed_atlas_foreign_subnational_priorities.sql
            20260822132000_expand_oecd_birth_self_employment_atlas.sql
            20260822133000_expand_foreign_firms_all_italian_regions.sql
            20260822134000_add_atlas_origin_business_communities.sql
            20260822135000_add_foreign_firms_sector_evidence.sql
            20260822143000_publication_series_architecture.sql
            20260822150000_prepare_content_versions_and_corrections.sql
            20260822151000_prepare_author_profiles.sql
            20260822155000_knowledge_search_architecture.sql
            20260822161000_editorial_automation_architecture.sql
            20260822162500_editorial_activity_insert_policy.sql
            20260822172000_harden_content_publication_gate.sql
            20260822183000_persistent_public_submission_rate_limits.sql
            20260822184500_editorial_login_rate_limits.sql
            20260822190000_enforce_privileged_mfa_aal2.sql
          )

          expected_prev="20260820160000"
          expected_count=209

          apply_one() {
            local file="$1"
            local version="${file%%_*}"
            local name="${file#${version}_}"
            name="${name%.sql}"
            local current_max current_count tmp dry

            test -s "supabase/migrations/$file"
            current_max="$(psql "$PROD_DB_URL" -Atqc "select max(version::text) from supabase_migrations.schema_migrations;")"
            current_count="$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations;")"
            [[ "$current_max" == "$expected_prev" ]]
            [[ "$current_count" == "$expected_count" ]]
            [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations where version='$version';")" == "0" ]]

            tmp="$(mktemp -d)"
            mkdir -p "$tmp/supabase/migrations"
            printf 'project_id = "production-release"\n' > "$tmp/supabase/config.toml"
            while IFS= read -r remote_version; do
              test -n "$remote_version"
              : > "$tmp/supabase/migrations/${remote_version}_remote.sql"
            done < <(psql "$PROD_DB_URL" -Atqc "select version from supabase_migrations.schema_migrations order by version;")
            cp "supabase/migrations/$file" "$tmp/supabase/migrations/$file"

            echo "===== DRY RUN $file ====="
            set +e
            dry="$(cd "$tmp" && supabase db push --db-url "$PROD_DB_URL" --include-all --dry-run 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$dry"
            [[ $rc -eq 0 ]]
            grep -q "$version" <<< "$dry"

            echo "===== APPLY $file ====="
            (cd "$tmp" && supabase db push --db-url "$PROD_DB_URL" --include-all)

            expected_count=$((expected_count + 1))
            [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations;")" == "$expected_count" ]]
            [[ "$(psql "$PROD_DB_URL" -Atqc "select max(version::text) from supabase_migrations.schema_migrations;")" == "$version" ]]
            [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from supabase_migrations.schema_migrations where version='$version' and name='$name';")" == "1" ]]
            rm -rf "$tmp"
            expected_prev="$version"
            echo "MIGRATION_${version} = PASS"
          }

          for file in "${files[@]}"; do
            apply_one "$file"

            case "$file" in
              20260822172000_harden_content_publication_gate.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='public' and c.relname='contents' and t.tgname='contents_human_publication_gate';")" == "1" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from pg_constraint where conname='contents_published_requires_editorial_owner_check';")" == "1" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='enforce_content_human_publication_gate';")" == "1" ]]
                echo "CHECKPOINT_PUBLICATION_GATE_16 = PASS"
                ;;
              20260822183000_persistent_public_submission_rate_limits.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select relrowsecurity::int from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='request_rate_limit_buckets';")" == "1" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from information_schema.table_privileges where table_schema='public' and table_name='request_rate_limit_buckets' and grantee in ('anon','authenticated');")" == "0" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select has_function_privilege('anon','public.consume_request_rate_limit(text,text,integer,integer)','EXECUTE')::int;")" == "0" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select has_function_privilege('authenticated','public.consume_request_rate_limit(text,text,integer,integer)','EXECUTE')::int;")" == "0" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname='public' and c.relname='editorial_submissions' and t.tgname='editorial_submissions_rate_limit';")" == "1" ]]
                echo "CHECKPOINT_PUBLIC_RATE_LIMIT_17 = PASS"
                ;;
              20260822190000_enforce_privileged_mfa_aal2.sql)
                [[ "$(psql "$PROD_DB_URL" -Atqc "select position('aal2' in pg_get_functiondef('public.access_has_active_application_role(text)'::regprocedure)) > 0;")" == "t" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select has_function_privilege('anon','public.consume_editorial_login_rate_limit(text,text)','EXECUTE')::int;")" == "0" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select has_function_privilege('authenticated','public.consume_editorial_login_rate_limit(text,text)','EXECUTE')::int;")" == "0" ]]
                [[ "$(psql "$PROD_DB_URL" -Atqc "select has_function_privilege('service_role','public.consume_editorial_login_rate_limit(text,text)','EXECUTE')::int;")" == "1" ]]
                echo "CHECKPOINT_AUTH_DB_18_19 = PASS"
                ;;
            esac
          done

          [[ "$expected_count" == "228" ]]
          [[ "$expected_prev" == "20260822190000" ]]
          echo "PRODUCTION_MIGRATIONS_1_19 = PASS"

      - name: Hold before migration 20 for real privileged MFA enrollment
        shell: bash
        run: |
          set -euo pipefail
          factors="$(psql "$PROD_DB_URL" -Atqc 'select count(*) from auth.mfa_factors;')"
          admins="$(psql "$PROD_DB_URL" -Atqc "select count(*) from public.account_role_assignments r join public.accounts a on a.id=r.account_id where r.role_code='amministratore_applicativo' and r.assignment_status='active' and a.account_status='active';")"
          [[ "$admins" -ge 1 ]]
          echo "PRODUCTION_ACTIVE_APP_ADMINS=$admins"
          echo "PRODUCTION_MFA_FACTORS=$factors"
          if [[ "$factors" == "0" ]]; then
            echo "MFA_ENROLLMENT_REQUIRED_BEFORE_MIGRATION_20 = YES"
          else
            echo "MFA_ENROLLMENT_REQUIRED_BEFORE_MIGRATION_20 = NO"
          fi
          echo "PHASE1_RELEASE_HOLD = PASS"
