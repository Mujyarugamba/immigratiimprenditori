name: Observatory test diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'observatory-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Compact failing test output
        shell: bash
        run: |
          set +e
          npm test >/tmp/tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 100 /tmp/tests.log
            exit "$status"
          fi
          tail -n 30 /tmp/tests.log
