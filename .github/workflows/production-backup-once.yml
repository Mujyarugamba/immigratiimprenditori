name: Production encrypted backup one-time

on:
  push:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - .github/workflows/production-backup-once.yml

permissions:
  contents: read
  statuses: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout metadata
        uses: actions/checkout@v4

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - id: secrets
        name: Verify backup secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL secret missing" >&2; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "BACKUP_ENCRYPTION_PASSPHRASE secret missing" >&2; exit 1; }
          echo "BACKUP_SECRET_GATE = PASS"

      - id: dump
        name: Export production database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          test -s backup/roles.sql
          test -s backup/schema.sql
          test -s backup/data.sql
          echo "BACKUP_DUMP = PASS"

      - id: integrity
        name: Validate and encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'CREATE TABLE .*contents' backup/schema.sql
          grep -Eq 'CREATE TABLE .*observatory_indicators' backup/schema.sql
          grep -Eq 'COPY .*languages' backup/data.sql
          tar -czf backup.tar.gz backup
          tar -tzf backup.tar.gz | grep -q '/roles.sql$'
          tar -tzf backup.tar.gz | grep -q '/schema.sql$'
          tar -tzf backup.tar.gz | grep -q '/data.sql$'
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output backup.tar.gz.gpg backup.tar.gz
          test -s backup.tar.gz.gpg
          sha256sum backup.tar.gz.gpg > backup.tar.gz.gpg.sha256
          echo "BACKUP_INTEGRITY_ENCRYPTION = PASS"

      - id: artifact
        name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: centro-studi-encrypted-backup-${{ github.run_id }}
          path: |
            backup.tar.gz.gpg
            backup.tar.gz.gpg.sha256
          if-no-files-found: error
          retention-days: 14

      - id: cleanup
        name: Remove plaintext material
        if: always()
        shell: bash
        run: |
          rm -rf backup backup.tar.gz
          test ! -e backup
          test ! -e backup.tar.gz
          echo "BACKUP_PLAINTEXT_REMOVAL = PASS"

      - name: Publish observable diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          DUMP_OUTCOME: ${{ steps.dump.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state="success"
          description="Encrypted production backup verified"
          if [[ "$SECRETS_OUTCOME" != "success" ]]; then
            state="failure"; description="Backup failed: secrets gate"
          elif [[ "$DUMP_OUTCOME" != "success" ]]; then
            state="failure"; description="Backup failed: database dump"
          elif [[ "$INTEGRITY_OUTCOME" != "success" ]]; then
            state="failure"; description="Backup failed: integrity/encryption"
          elif [[ "$ARTIFACT_OUTCOME" != "success" ]]; then
            state="failure"; description="Backup failed: artifact upload"
          elif [[ "$CLEANUP_OUTCOME" != "success" ]]; then
            state="failure"; description="Backup failed: plaintext cleanup"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"backup/production\",\"description\":\"${description}\"}"