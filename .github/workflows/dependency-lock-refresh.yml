name: Dependency lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-next-lock:
    if: github.head_ref == 'editorial-desk-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify target exists in npm registry
        run: test "$(npm view next@16.3.1 version)" = "16.3.1"

      - name: Refresh Next.js lock
        run: npm install next@16.3.1 --save-exact --package-lock-only

      - name: Verify resolved Next.js and audit
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.1') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/next'].version!=='16.3.1') process.exit(1)"
          npm audit --audit-level=high

      - name: Commit verified dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): upgrade Next.js to 16.3.1"
          git push origin HEAD:${{ github.head_ref }}
