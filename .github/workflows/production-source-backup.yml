# Release-time backup refresh: 2026-08-24
name: Production source logical backup

on:
  push:
    branches:
      - ops/production-restore-drill-20260823
    paths:
      - .github/workflows/production-source-backup.yml
  pull_request:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - .github/workflows/production-source-backup.yml

permissions:
  contents: read

jobs:
  backup-production:
    if: >-
      github.ref == 'refs/heads/ops/production-restore-drill-20260823' ||
      github.head_ref == 'ops/production-restore-drill-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      EXPECTED_PROD_REF: hvfvfatlaspcpszgizhg
    steps:
      - name: Check out candidate tooling
        uses: actions/checkout@v4

      - name: Validate production connection identity without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_DB_URL"
          test -n "$BACKUP_PASSPHRASE"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          u = urlsplit(os.environ['PROD_DB_URL'])
          username = unquote(u.username or '')
          expected = 'postgres.' + os.environ['EXPECTED_PROD_REF']
          if username != expected:
              raise SystemExit('PRODUCTION_CONNECTION_IDENTITY = FAIL (unexpected project ref)')
          if not (u.hostname or '').endswith('.pooler.supabase.com'):
              raise SystemExit('PRODUCTION_CONNECTION_IDENTITY = FAIL (not Supabase pooler)')
          if u.port != 5432:
              raise SystemExit('PRODUCTION_CONNECTION_IDENTITY = FAIL (expected session-pooler port 5432)')
          print('PRODUCTION_CONNECTION_IDENTITY = PASS')
          PY

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create official Supabase logical backup components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-production
          supabase db dump --db-url "$PROD_DB_URL" -f backup-production/roles.sql --role-only
          supabase db dump --db-url "$PROD_DB_URL" -f backup-production/schema.sql
          supabase db dump --db-url "$PROD_DB_URL" -f backup-production/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          for f in backup-production/roles.sql backup-production/schema.sql backup-production/data.sql; do
            test -s "$f"
          done
          grep -Eq 'CREATE TABLE .*contents' backup-production/schema.sql
          grep -Eq 'CREATE TABLE .*observatory_indicators' backup-production/schema.sql
          grep -Eq 'COPY .*languages' backup-production/data.sql
          echo "PRODUCTION_SUPABASE_LOGICAL_DUMP = PASS"

      - name: Normalize platform-managed role statements
        shell: bash
        run: |
          set -euo pipefail
          python3 - backup-production/roles.sql <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          parts = re.split(r'(?<=;)', text)
          kept = []
          alter_role = re.compile(r'(?is)^\s*ALTER\s+ROLE\b.*\blog_min_messages\b')
          grant_parameter = re.compile(r'(?is)^\s*GRANT\s+SET\s+ON\s+PARAMETER\s+"?log_min_messages"?\s+TO\b')
          for part in parts:
              statement = part.strip()
              if statement and (alter_role.match(statement) or grant_parameter.match(statement)):
                  continue
              kept.append(part)
          filtered = ''.join(kept)
          if re.search(r'(?i)\blog_min_messages\b', filtered):
              raise SystemExit('unrecognized log_min_messages statement survived normalization')
          path.write_text(filtered, encoding='utf-8')
          print('PRODUCTION_ROLE_NORMALIZATION = PASS')
          PY

      - name: Encrypt backup bundle and remove plaintext
        shell: bash
        run: |
          set -euo pipefail
          tar -C backup-production -cf backup-production/production-source.tar roles.sql schema.sql data.sql
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:BACKUP_PASSPHRASE \
            -in backup-production/production-source.tar \
            -out backup-production/production-source.tar.enc
          sha256sum backup-production/production-source.tar.enc > backup-production/production-source.tar.enc.sha256
          rm -f backup-production/roles.sql backup-production/schema.sql backup-production/data.sql backup-production/production-source.tar
          test -s backup-production/production-source.tar.enc
          test ! -e backup-production/schema.sql
          echo "PRODUCTION_BACKUP_ENCRYPTION = PASS"
          echo "PRODUCTION_BACKUP_PLAINTEXT_CLEANUP = PASS"

      - name: Upload encrypted production-source artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-source-backup-${{ github.run_id }}
          path: |
            backup-production/production-source.tar.enc
            backup-production/production-source.tar.enc.sha256
          if-no-files-found: error
          retention-days: 7
