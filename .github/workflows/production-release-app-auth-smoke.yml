name: Production release app auth smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-release-app-auth-smoke.yml

permissions:
  contents: read

jobs:
  verify-release-app-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create production release App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PRODUCTION_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODUCTION_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Verify authenticated repository access
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.PRODUCTION_RELEASE_APP_ID }}
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.release-token.outputs.installation-id }}
        shell: bash
        run: |
          set -euo pipefail

          test "$EXPECTED_APP_ID" = "4774125" || {
            echo "Unexpected production release App ID." >&2
            exit 1
          }

          test -n "$APP_SLUG" || {
            echo "GitHub App slug was not returned." >&2
            exit 1
          }

          test -n "$INSTALLATION_ID" || {
            echo "GitHub App installation ID was not returned." >&2
            exit 1
          }

          repo="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name)"
          test "$repo" = "$GITHUB_REPOSITORY" || {
            echo "Installation token cannot read the expected repository." >&2
            exit 1
          }

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          printf '%s' "$main_sha" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "Installation token could not read main ref." >&2
            exit 1
          }

          echo "PRODUCTION_RELEASE_APP_TOKEN = PASS"
          echo "PRODUCTION_RELEASE_APP_REPOSITORY_ACCESS = PASS"

      - name: Assert smoke is read-only
        shell: bash
        run: |
          set -euo pipefail
          echo "No repository write was attempted by this smoke test."
          echo "PRODUCTION_RELEASE_APP_SMOKE_READ_ONLY = PASS"
