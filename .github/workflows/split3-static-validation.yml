name: SPLIT-3 static validation

on:
  push:
    branches:
      - split-3b-executable-baseline
  workflow_dispatch:

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate SPLIT-3 runtime boundary
        run: node scripts/split3/validate-runtime-boundary.mjs

      - name: Typecheck
        run: npm run typecheck
