name: Supabase local migration validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-local-validation.yml"

permissions:
  contents: read

jobs:
  validate-local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Initialize ephemeral local config
        run: supabase init

      - name: Replay every migration on a fresh local database
        run: supabase db start

      - name: Lint PostgreSQL functions and schema
        run: supabase db lint --level error --fail-on error

      - name: Stop ephemeral local stack
        if: always()
        run: supabase stop --no-backup || true
