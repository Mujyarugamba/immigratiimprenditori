name: Production restore secret preflight

on:
  push:
    branches:
      - ops/production-restore-drill-20260823
    paths:
      - .github/workflows/production-restore-secret-preflight.yml
  pull_request:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - .github/workflows/production-restore-secret-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/ops/production-restore-drill-20260823' ||
      github.head_ref == 'ops/production-restore-drill-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify restore secret presence only
        env:
          PRODUCTION_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for item in \
            "SUPABASE_DB_URL:$PRODUCTION_DB_URL" \
            "SUPABASE_STAGING_DB_URL:$STAGING_DB_URL" \
            "BACKUP_ENCRYPTION_PASSPHRASE:$BACKUP_PASSPHRASE"
          do
            name="${item%%:*}"
            value="${item#*:}"
            if [ -n "$value" ]; then
              echo "$name = PRESENT"
            else
              echo "$name = MISSING"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "RESTORE_SECRET_PREFLIGHT = FAIL"
            exit 1
          fi
          echo "RESTORE_SECRET_PREFLIGHT = PASS"
