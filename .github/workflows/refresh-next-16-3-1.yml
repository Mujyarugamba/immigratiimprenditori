name: Refresh Next.js 16.3.1 lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'stories-interviews-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js exactly
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').dependencies.next === '16.3.1' ? 0 : 1)"; then
            echo "Next.js already 16.3.1; nothing to do."
            exit 0
          fi
          npm install next@16.3.1 --save-exact
          git diff --exit-code -- . ':!package.json' ':!package-lock.json'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): upgrade Next.js to 16.3.1"
          git push origin HEAD:${{ github.head_ref }}
