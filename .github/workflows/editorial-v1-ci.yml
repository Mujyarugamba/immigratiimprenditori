name: Editorial v1 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      CRON_SECRET: ci-cron-secret-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Offline runtime smoke
        run: |
          npm run start -- -p 3100 > /tmp/immigrati-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl --max-time 2 -fsS http://127.0.0.1:3100/chi-siamo > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/immigrati-next.log
            exit 1
          fi

          for path in /chi-siamo /sostieni /contribuisci /robots.txt /sitemap.xml; do
            code=$(curl --max-time 5 -sS -o /tmp/route-body -w '%{http_code}' "http://127.0.0.1:3100$path")
            if [ "$code" != "200" ]; then
              echo "$path returned $code"
              cat /tmp/route-body
              cat /tmp/immigrati-next.log
              exit 1
            fi
          done

          private_code=$(curl --max-time 5 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/app/redazione)
          if [ "$private_code" != "307" ] && [ "$private_code" != "302" ]; then
            echo "/app/redazione expected redirect, got $private_code"
            cat /tmp/immigrati-next.log
            exit 1
          fi
