name: Editorial v1 CI

on:
  pull_request:
    branches:
      - main
      - feature/institutional-identity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Supabase Auth deprecation guard
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -R --line-number --include='*.sql' --fixed-strings 'auth.role()' \
            supabase/baseline supabase/standalone-evolutions supabase/migrations \
            | grep -vE ':[0-9]+:[[:space:]]*--' || true)"
          if [[ -n "$matches" ]]; then
            echo "Deprecated auth.role() usage found in executable Supabase SQL:"
            echo "$matches"
            exit 1
          fi
          echo "SUPABASE_AUTH_DEPRECATION_GUARD = PASS"

      - name: Next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
        run: npm run build

      - name: HTTP smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
        run: npm run test:smoke

      - name: Public browser E2E
        run: npx playwright test --config=playwright.public.config.ts
