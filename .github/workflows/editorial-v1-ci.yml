name: Editorial v1 CI

on:
  pull_request:
    branches:
      - main
      - feature/institutional-identity
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Go-live functional source gates
        run: node scripts/ci/go-live-functional-gates.mjs

      - name: Radar quality self-tests
        env:
          RADAR_SELF_TEST: "1"
        run: |
          node scripts/external-data/radar-nightly.mjs
          node scripts/external-data/radar-emn.mjs

      - name: Source-health safety self-test
        env:
          SOURCE_HEALTH_SELF_TEST: "1"
        run: node scripts/external-data/source-health-check.mjs

      - name: Privacy runtime tracker/embed guard
        run: node scripts/ci/privacy-runtime-guard.mjs

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Supabase Auth deprecation guard
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -R --line-number --include='*.sql' --fixed-strings 'auth.role()' \
            supabase/baseline supabase/standalone-evolutions supabase/migrations \
            | grep -vE ':[0-9]+:[[:space:]]*--' || true)"
          if [[ -n "$matches" ]]; then
            echo "Deprecated auth.role() usage found in executable Supabase SQL:"
            echo "$matches"
            exit 1
          fi
          echo "SUPABASE_AUTH_DEPRECATION_GUARD = PASS"

      - name: Next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
        run: npm run build

      - name: HTTP smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
        run: npm run test:smoke

      - name: Public browser E2E
        run: npx playwright test --config=playwright.public.config.ts

      - name: Lighthouse mobile performance gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
        run: npx --yes @lhci/cli@0.15.1 autorun
