name: Editorial v1 CI

on:
  pull_request:
    branches:
      - main
      - feature/institutional-identity
  push:
    branches:
      - feature/research-radar-ai-knowledge-20260822
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
        run: npm run build

      - name: HTTP smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
        run: npm run test:smoke

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public browser E2E
        run: npx playwright test --config=playwright.public.config.ts
