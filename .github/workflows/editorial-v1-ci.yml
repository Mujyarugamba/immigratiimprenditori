name: Editorial v1 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Smoke Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          base="https://immigratiimprenditori-git-editorial-fo-1b2713-inquotus-projects.vercel.app"
          for path in / /contribuisci; do
            code=$(curl --retry 3 --retry-all-errors --max-time 20 -sS -o /tmp/body -w '%{http_code}' "$base$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
