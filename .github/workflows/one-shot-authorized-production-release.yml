name: One-shot authorized Production promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: one-shot-production-promotion-20260831
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/one-shot-production-release-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_MAIN_SHA: 2dfc5e9f25e69edecd6bbe31c3ffe314a433aa52
      EXPECTED_PRODUCTION_BEFORE: d588f88ad6f827fdd062ca7f7d38e4a1ee7a2ac0

    steps:
      - name: Create canonical production release token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PRODUCTION_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODUCTION_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: false

      - name: Verify one-shot release preflight
        env:
          RELEASE_APP_TOKEN: ${{ steps.release-app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_MAIN_SHA" || {
            echo "Refusing release: PR base SHA differs from the explicitly authorized main SHA." >&2
            exit 1
          }

          rules_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/rules/branches/production?per_page=100"
          rules_payload="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$rules_api")"

          missing="$(printf '%s' "$rules_payload" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const rules = JSON.parse(input);
              if (!Array.isArray(rules)) throw new Error("GitHub branch-rules response is not an array");
              const required = ["update", "deletion", "non_fast_forward"];
              const active = new Set(rules.map((rule) => rule?.type).filter(Boolean));
              process.stdout.write(required.filter((type) => !active.has(type)).join(","));
            });
          ')"
          test -z "$missing" || {
            echo "Refusing release: production branch protection is incomplete: $missing" >&2
            exit 1
          }

          auth="$(printf 'x-access-token:%s' "$RELEASE_APP_TOKEN" | base64 -w0)"
          git_app() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"
          }

          git_app fetch --no-tags origin main production
          main_sha="$(git rev-parse origin/main)"
          production_sha="$(git rev-parse origin/production)"

          test "$main_sha" = "$EXPECTED_MAIN_SHA" || {
            echo "Refusing release: main moved after authorization." >&2
            exit 1
          }
          test "$production_sha" = "$EXPECTED_PRODUCTION_BEFORE" || {
            echo "Refusing release: production moved after preflight." >&2
            exit 1
          }
          git merge-base --is-ancestor "$production_sha" "$main_sha" || {
            echo "Refusing release: production is not an ancestor of approved main." >&2
            exit 1
          }

          echo "ONE_SHOT_PRODUCTION_PREFLIGHT = PASS"

      - name: Fast-forward protected production
        env:
          RELEASE_APP_TOKEN: ${{ steps.release-app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$RELEASE_APP_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$EXPECTED_MAIN_SHA:refs/heads/production"
          echo "ONE_SHOT_PRODUCTION_FAST_FORWARD = PASS"

      - name: Verify production exact SHA
        env:
          RELEASE_APP_TOKEN: ${{ steps.release-app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$RELEASE_APP_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin production
          actual="$(git rev-parse origin/production)"
          test "$actual" = "$EXPECTED_MAIN_SHA" || {
            echo "Production ref mismatch after release." >&2
            exit 1
          }
          echo "ONE_SHOT_PRODUCTION_REF_VERIFY = PASS"
