name: Production to staging read-only verification

on:
  pull_request:
    branches:
      - feature/research-radar-ai-knowledge-20260822
    paths:
      - .github/workflows/verify-production-to-staging-readonly.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      EXPECTED_PROD_REF: hvfvfatlaspcpszgizhg
    steps:
      - name: Compare production and staging read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_DB_URL"
          test -n "$STAGING_DB_URL"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote
          prod=urlsplit(os.environ['PROD_DB_URL'])
          stage=urlsplit(os.environ['STAGING_DB_URL'])
          pu=unquote(prod.username or '')
          su=unquote(stage.username or '')
          if pu != 'postgres.' + os.environ['EXPECTED_PROD_REF']:
              raise SystemExit('VERIFY_IDENTITY = FAIL production')
          if not su.startswith('postgres.') or su == pu:
              raise SystemExit('VERIFY_IDENTITY = FAIL staging')
          print('VERIFY_IDENTITIES = PASS')
          PY
          qprod() { psql "$PROD_DB_URL" -Atqc "$1"; }
          qstage() { psql "$STAGING_DB_URL" -Atqc "$1"; }
          compare() {
            label="$1"; sql="$2"
            p="$(qprod "$sql")"
            s="$(qstage "$sql")"
            echo "$label production=$p staging=$s"
            [[ "$p" == "$s" ]]
          }
          compare contents 'select count(*) from public.contents;'
          compare indicators 'select count(*) from public.observatory_indicators;'
          compare languages 'select count(*) from public.languages;'
          compare accounts 'select count(*) from public.accounts;'
          compare profiles 'select count(*) from public.profiles;'
          compare auth_users 'select count(*) from auth.users;'
          compare auth_identities 'select count(*) from auth.identities;'
          compare migration_count 'select count(*) from supabase_migrations.schema_migrations;'
          compare migration_max "select coalesce(max(version::text),'0') from supabase_migrations.schema_migrations;"
          rls="$(qstage "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('accounts','account_role_assignments','editorial_inbox_items','editorial_submissions') and c.relrowsecurity;")"
          [[ "$rls" == "4" ]]
          hook="$(qstage "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace join pg_proc p on p.oid=t.tgfoid join pg_namespace pn on pn.oid=p.pronamespace where not t.tgisinternal and n.nspname='auth' and c.relname='users' and t.tgname='on_auth_user_created' and pn.nspname='public' and p.proname='handle_new_user';")"
          [[ "$hook" == "1" ]]
          account_orphans="$(qstage "select count(*) from public.accounts a left join auth.users u on u.id=a.auth_user_id where a.auth_user_id is not null and u.id is null;")"
          profile_orphans="$(qstage "select count(*) from public.profiles p left join auth.users u on u.id=p.id where u.id is null;")"
          [[ "$account_orphans" == "0" ]]
          [[ "$profile_orphans" == "0" ]]
          echo "STAGING_RLS_CRITICAL = PASS"
          echo "STAGING_AUTH_HOOK = PASS"
          echo "STAGING_AUTH_ORPHANS = PASS"
          echo "PRODUCTION_TO_STAGING_READONLY_VERIFY = PASS"
